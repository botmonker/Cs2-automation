name = "cs2-automation"
main = "src/index.js"
compatibility_date = "2026-11-13"

# DO NOT add billing. Free plan only. No payment method on the account.
[[d1_databases]]
binding = "DB"
database_name = "cs2-zero-budget"
database_id = "7225657c-ddf9-4026-82df-a22e6494602d"

[vars]
CITO_MONTHLY_LIMIT = "500"

# Secrets (set in the Cloudflare dashboard, NEVER in this file or git):
# CITO_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

[triggers]
# Two separate triggers (the dashboard rejected the comma form "0 6,18 * * *").
# 06:00 UTC = 11:30 IST, 18:00 UTC = 23:30 IST. 2 of max 5 cron triggers.
crons = ["0 6 * * *", "0 18 * * *"]  # fixture + results sync, twice daily UTC
